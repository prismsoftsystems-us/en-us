<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128"
     viewBox="0 0 100 100"
     fill="none">

    <!-- Outer hex/prism shape -->
    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25"
             stroke="#0077d6"
             stroke-width="4"
             stroke-linejoin="round"/>

    <!-- Inner prism split lines -->
    <line x1="50" y1="5" x2="50" y2="95"
          stroke="#0077d6"
          stroke-width="2"
          opacity="0.8"/>

    <line x1="10" y1="25" x2="90" y2="75"
          stroke="#0077d6"
          stroke-width="2"
          opacity="0.5"/>

    <line x1="90" y1="25" x2="10" y2="75"
          stroke="#0077d6"
          stroke-width="2"
          opacity="0.5"/>

</svg>